# =========================================================================
# CONFIGURACION RABBITMQ NODO 1 (Cluster Pedidos360)
# =========================================================================
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Politica de particion de red para alta disponibilidad
cluster_partition_handling = autoheal

# Usuario administrador inicial
default_user = admin
default_pass = admin123
default_user_tags.administrator = true

# Habilitar listeners
listeners.tcp.default = 5672
management.tcp.port = 15672
