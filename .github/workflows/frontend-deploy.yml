name: Frontend GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pedidos360-pages
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://jfbxfcaajg.execute-api.us-east-1.amazonaws.com' }}
          PAGES_BASE_URL: https://alvasmash.github.io/CloudNative/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist/pages/browser
          publish_branch: gh-pages
          enable_jekyll: false
