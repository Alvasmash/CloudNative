

# =============================================================================
# DOCKER COMPOSE - PLATAFORMA CLOUD NATIVE PEDIDOS360
# =============================================================================
# Demostracion de:
# 1. Cluster RabbitMQ de 2 nodos auto-formado con Erlang Cookie compartida.
# 2. Microservicio backend Spring Boot conectado al cluster y asegurado por JWT.
# 3. Frontend Angular en Nginx con SPA routing.
# 4. Red bridge dedicada y persistencia mediante volumenes nombrados.
# =============================================================================

networks:
  pedidos360-network:
    name: pedidos360-network
    driver: bridge

volumes:
  rabbit1_data:
    name: pedidos360-rabbit1-data
  rabbit2_data:
    name: pedidos360-rabbit2-data
  backend_data:
  kafka_data:

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: pedidos360-local-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ===========================================================================
  # NODO 1 RABBITMQ (LIDER INICIAL DEL CLUSTER)
  # ===========================================================================
  rabbit1:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-PEDIDOS360_SECRET_COOKIE_2026}
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - ./docker/rabbitmq/rabbitmq-node1.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbit1_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"    # Puerto AMQP estandar
      - "127.0.0.1:15672:15672"  # Consola Management RabbitMQ Nodo 1
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # NODO 2 RABBITMQ (MIEMBRO DEL CLUSTER)
  # ===========================================================================
  rabbit2:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-PEDIDOS360_SECRET_COOKIE_2026}
      RABBITMQ_NODENAME: rabbit@rabbit2
    volumes:
      - ./docker/rabbitmq/rabbitmq-node2.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbit2_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5673:5672"    # AMQP Nodo 2 expuesto en host 5673
      - "127.0.0.1:15673:15672"  # Consola Management RabbitMQ Nodo 2 en host 15673
    depends_on:
      rabbit1:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # BACKEND SPRING BOOT (MICROSERVICIO RESOURCE SERVER)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedidos360-backend
    volumes:
      - backend_data:/app/data
    environment:
      SPRING_RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      SPRING_PROFILES_ACTIVE: local
      APP_KAFKA_ENABLED: 'true'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_ADDRESS: 0.0.0.0
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_started
    networks:
      - pedidos360-network

  # ===========================================================================
  # FRONTEND ANGULAR (DISTRIBUIDO MEDIANTE NGINX)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pedidos360-network
