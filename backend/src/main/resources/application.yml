server:
  port: 8080

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  profiles:
    default: local
  application:
    name: pedidos360-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pedidos360}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

app:
  accounts:
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    hash-routing: ${FRONTEND_HASH_ROUTING:false}
    mail-from: ${MAIL_FROM:registro@pedidos360.local}
  security:
    issuer: ${JWT_ISSUER:https://login.microsoftonline.com/16c2a7cf-f000-475f-a847-f95ee0b36404/v2.0}
    audience: ${JWT_AUDIENCE:aef48164-1df8-49e6-b9f2-c1d8953ea200}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
